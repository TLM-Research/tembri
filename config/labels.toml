# PropAMM layer-0 address labels. Sources reviewed 2026-10-28:
# - BuilderNet API Reference, "propAMM stream addresses" (registry and Metric
#   oracle contracts): https://buildernet.org/docs/api
# - Lambda Class PropAMMRouter deployed-contract table (venue entrypoints and
#   reference router): https://github.com/lambdaclass/propamm-router-contracts
# All addresses below returned non-empty bytecode through eth_getCode on
# Ethereum mainnet at block 26,293,715. They are entrypoint/oracle labels, not
# a claim that each address is a distinct liquidity pool.
#
# Event topics are intentionally absent. A topic is enabled only after its
# deployed contract ABI and decoded sample receipts are reviewed.
[propamm]
chain_id = 1
validated_block = 26293715
datafeed_registry = "0xda7afeed021eafc1c1af9c362de477dad0396b81"
