# FermiSwap's verified fill ABI is
# Swapped(address,address,address,uint256,uint256,address), with the first
# three addresses indexed. Reviewed against its deployed event logs and the
# verified ABI view on Etherscan on 2026-10-28.
propamm_fermiswap_fill = "0x1eeaa4acf3c225a4033105c2647625dbb298dec93b14e16253c4231e26c02b1d"
# El Zorro emits the same Swapped event. Its EIP-1967 proxy
# 0xcf211b4dd0d2be5c173ea57bcf938fc61d1d3bd3 resolves on Sourcify to the
# verified implementation `PropAMM` at 0x9c39d26bef47f1c2450f89296dc8c3bc614b815b
# (exact match), whose ABI declares the same signature. Reviewed 2026-10-29.
propamm_el_zorro_fill = "0x1eeaa4acf3c225a4033105c2647625dbb298dec93b14e16253c4231e26c02b1d"
# bopAMM emits the same Swapped event from 0xb09aaa89…, verified on Sourcify
# as `BopAmm` (exact match). Swapped fires once per swap; MakerFill fires once
# per maker leg and is not used. Reviewed 2026-10-30.
propamm_bopamm_fill = "0x1eeaa4acf3c225a4033105c2647625dbb298dec93b14e16253c4231e26c02b1d"
# Six more emitters of the same Swapped event, reviewed 2026-10-30. In a
# sample of every sixth Xatu chunk from 25943000 to 26159999, amountIn
# matched a tokenIn transfer to the emitter and amountOut a tokenOut transfer
# to recipient in every log (legacy bopAMM: as for bopAMM, some outputs are
# paid in several maker legs). Identity per emitter:
# - Kipseli 0x71e790dd…, legacy BopAmm 0xb09aaa56…, GoliathAMM 0x4367985a…:
#   Sourcify exact match, ABI declares this Swapped.
# - Metric 0xe715dc29…: Sourcify match `MetricRouterAdapter`, same ABI.
# - Tempest 0x00000003…: ERC1967Proxy with an unverified implementation;
#   accepted on the BuilderNet and Lambda Class listings plus the transfers.
# - Park 0x77047af6…: Sourcify `ParkERC1967Proxy`, implementation
#   0x73349f20… unverified; accepted on the proxy name plus the transfers.
# 0x3ce2672a… also emits it and is a registry target, but has no identity.
propamm_tempest_fill = "0x1eeaa4acf3c225a4033105c2647625dbb298dec93b14e16253c4231e26c02b1d"
propamm_metric_fill = "0x1eeaa4acf3c225a4033105c2647625dbb298dec93b14e16253c4231e26c02b1d"
propamm_kipseli_fill = "0x1eeaa4acf3c225a4033105c2647625dbb298dec93b14e16253c4231e26c02b1d"
propamm_bopamm_legacy_fill = "0x1eeaa4acf3c225a4033105c2647625dbb298dec93b14e16253c4231e26c02b1d"
propamm_goliath_fill = "0x1eeaa4acf3c225a4033105c2647625dbb298dec93b14e16253c4231e26c02b1d"
propamm_park_fill = "0x1eeaa4acf3c225a4033105c2647625dbb298dec93b14e16253c4231e26c02b1d"
# FermiSwap's pricing engine 0x0109aa91… emits only this topic, once in each
# update transaction (selector 0xacee8aab) and in no other transaction on
# 2026-10-03..09. The engine is unverified; the update rule rests on
